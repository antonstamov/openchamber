name: Fork sync and release

# Fork: keeps main-ru on top of upstream main and releases the result.
# Runs on schedule and on demand. If the merge is clean it is committed by
# the script; on conflicts an OpenCode agent resolves them (needs the
# OPENCODE_API_KEY secret), then the tree is verified, pushed, and tagged
# when the version is new, which starts the release workflow.

on:
  schedule:
    # 01:00 UTC is 04:00 in Moscow (MSK is UTC+3, no DST). Off-peak hours,
    # because GitHub queues scheduled runs for hours: the early slot leaves
    # margin before the 11:30 MSK watchdog, which triggers the workflow
    # itself when the scheduled run has not appeared.
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      model:
        description: 'Model for the merge agent (provider/model). Empty = FORK_MERGE_MODEL repo variable, which must be set for merges with conflicts.'
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
      FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      # The model lives only in the FORK_MERGE_MODEL repo variable (or the
      # dispatch input for one-off runs); there is no built-in default, so a
      # missing model fails loudly instead of spending on a surprise default.
      MODEL: ${{ github.event.inputs.model || vars.FORK_MERGE_MODEL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main-ru
          fetch-depth: 0
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch upstream and roll main-upstream forward
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${FORK_SYNC_TOKEN}@github.com/antonstamov/openchamber.git"
          git remote add upstream https://github.com/openchamber/openchamber.git
          git fetch upstream main
          git push origin FETCH_HEAD:refs/heads/main-upstream

      - name: Try a clean merge
        id: merge
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "status=up-to-date" >> "$GITHUB_OUTPUT"
          elif git merge --no-commit upstream/main; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "status=conflicts" >> "$GITHUB_OUTPUT"
          fi

      - name: Install OpenCode for the merge agent
        if: steps.merge.outputs.status != 'up-to-date'
        run: |
          set -euo pipefail
          installer="$(mktemp)"
          trap 'rm -f "$installer"' EXIT
          curl --retry 2 --retry-all-errors -fsSL --connect-timeout 15 \
            https://opencode.ai/install -o "$installer"
          bash "$installer" --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Merge with the agent
        if: steps.merge.outputs.status == 'conflicts'
        env:
          PROMPT_FILE: .github/fork-merge-prompt.md
        run: |
          set -euo pipefail
          if [ -z "${MODEL:-}" ]; then
            echo 'No model configured: set the FORK_MERGE_MODEL repo variable or pass the model input.' >&2
            exit 1
          fi
          prompt="$(cat "$PROMPT_FILE")"
          prompt="$prompt

          Upstream head: $(git rev-parse upstream/main). Worktree is on main-ru with no merge in progress; start it yourself."
          timeout --signal=TERM --kill-after=60s 45m \
            opencode run --agent fork-merge --model "$MODEL" --format json "$prompt" \
            | tee "$RUNNER_TEMP/fork-merge.jsonl" \
            | jq -r 'if .type == "text" then "[\(.timestamp / 1000 | floor | strftime("%Y-%m-%d %H:%M:%S"))] \(.part.text // "")"
                     elif .type == "tool_use" then "[\(.timestamp / 1000 | floor | strftime("%Y-%m-%d %H:%M:%S"))] -> \(.part.tool // "tool"): \(((.part.state.input.command // .part.state.input.filePath // "") | tostring | .[0:160]))"
                     else empty end'

      - name: Verify the merged tree
        id: verify1
        continue-on-error: true
        if: steps.merge.outputs.status != 'up-to-date'
        run: |
          set -euo pipefail
          bun test packages/ui/src/lib/i18n/
          bun check -b

      - name: Fix the merged tree with the agent
        # Any red verify gets fix passes, not just clean merges: a
        # conflict merge the agent already resolved can still leave the tree
        # red (e.g. missing translations for new upstream strings), and
        # without this the run dies at the final verify with no recovery.
        # Up to FIX_ROUNDS agent passes: an early exit that fixes nothing
        # just triggers another round with the failing output attached.
        if: steps.merge.outputs.status != 'up-to-date' && steps.verify1.outcome == 'failure'
        env:
          PROMPT_FILE: .github/fork-merge-prompt.md
          FIX_ROUNDS: 2
          FIX_AGENT_TIMEOUT: 25m
        run: |
          set -euo pipefail
          if [ -z "${MODEL:-}" ]; then
            echo 'No model configured: set the FORK_MERGE_MODEL repo variable or pass the model input.' >&2
            exit 1
          fi
          base_prompt="$(cat "$PROMPT_FILE")"
          base_prompt="$base_prompt

          FIX MODE, not a fresh merge: upstream/main is already merged into the worktree (check git status), the tests above it are red. Do not start a new merge. Run the i18n suite and bun check, fix what is red following the same rules, stage the fixes with explicit git add paths, and commit. If everything is already green without changes from you (flaky check), just commit the merge. Do not push, do not tag.
          Work the FULL failure list the suite prints (dozens of missing keys and stale keys are normal after a big upstream batch): translate every missing key, delete every stale key. Re-run the suite yourself until it passes; ending the run with red tests and no changes fails loudly instead of silently."
          green=0
          for round in $(seq 1 "${FIX_ROUNDS:-2}"); do
            if bun test packages/ui/src/lib/i18n/ >"$RUNNER_TEMP/fix-check-r$round.log" 2>&1; then
              if bun check -b >>"$RUNNER_TEMP/fix-check-r$round.log" 2>&1; then
                echo "fix-check green on round $round"
                green=1
                break
              fi
            fi
            echo "fix-check red on round $round, invoking the fix agent"
            failures="$(tail -n 60 "$RUNNER_TEMP/fix-check-r$round.log")"
            prompt="$base_prompt

          Failures this round:
          $failures"
            timeout --signal=TERM --kill-after=60s "${FIX_AGENT_TIMEOUT:-25m}" \
              opencode run --agent fork-merge --model "$MODEL" --format json "$prompt" \
              | tee "$RUNNER_TEMP/fork-merge-fix-r$round.jsonl" \
              | jq -r 'if .type == "text" then "[\(.timestamp / 1000 | floor | strftime("%Y-%m-%d %H:%M:%S"))] \(.part.text // "")"
                       elif .type == "tool_use" then "[\(.timestamp / 1000 | floor | strftime("%Y-%m-%d %H:%M:%S"))] -> \(.part.tool // "tool"): \(((.part.state.input.command // .part.state.input.filePath // "") | tostring | .[0:160]))"
                       else empty end'
          done
          if [ "$green" != 1 ]; then
            echo "fix agent did not reach green in ${FIX_ROUNDS:-2} rounds; see the fork-merge-agent-logs artifact on this run" >&2
            exit 1
          fi

      - name: Verify the final tree
        id: verify-final
        if: steps.merge.outputs.status != 'up-to-date'
        run: |
          set -euo pipefail
          bun test packages/ui/src/lib/i18n/
          bun check -b

      - name: Commit the merge if needed
        if: steps.merge.outputs.status != 'up-to-date' && steps['verify-final'].outcome == 'success'
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "worktree clean, nothing to commit"
          else
            if git grep -l -e '^<<<<<<< ' -- . ':!bun.lock' | grep -q .; then
              echo 'unresolved conflict markers remain' >&2
              git grep -l -e '^<<<<<<< ' -- . ':!bun.lock'
              exit 1
            fi
            # The agent is told to commit, this only catches it when it did
            # not: stage resolutions of tracked files and finish the merge.
            # Untracked files never ride along.
            git add -u
            git commit --no-edit -m "Merge remote-tracking branch 'upstream/main' into main-ru"
          fi

      - name: Assert the merge is committed
        if: steps.merge.outputs.status != 'up-to-date'
        run: |
          set -euo pipefail
          git merge-base --is-ancestor upstream/main HEAD || { echo 'upstream/main is not merged into HEAD' >&2; exit 1; }
          git diff --quiet && git diff --cached --quiet || { echo 'worktree is not clean' >&2; git status --short; exit 1; }

      - name: Push, tag a new version
        # The script no-ops on quiet days (HEAD already carries the latest
        # release tag). Dispatch always reaches it so fork-only commits
        # release even when upstream has nothing new.
        if: steps.merge.outputs.status != 'up-to-date' || github.event_name == 'workflow_dispatch'
        id: tag
        run: |
          set -euo pipefail
          node .github/fork-release-version.mjs

      - name: Open an issue on failure
        if: failure()
        run: |
          set -euo pipefail
          gh issue create --repo antonstamov/openchamber \
            --title "Fork sync failed: ${{ github.run_id }}" \
            --body "The scheduled merge of upstream/main into main-ru failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} — agent logs: fork-merge-agent-logs artifact on that page."

      - name: Upload merge agent logs
        # The agent's full JSONL: without it an early or silent agent exit
        # is undebuggable (the stdout tail shows only text and tool calls).
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.3.0
        with:
          name: fork-merge-agent-logs
          path: ${{ runner.temp }}/fork-merge*.jsonl
          if-no-files-found: ignore
          retention-days: 14
